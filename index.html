<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dallas Children's Chorus</title>
<meta name="description" content="Dallas Children's Chorus — Official Children's Chorus of the Dallas Symphony Orchestra.">
<style>
  :root {
    --bg: #ffffff;
    --navy: #0B2A49;
    --email: #0B2A4A;
    --email-hover: #14406e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    position: relative;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 6vw;
  }

  main {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    opacity: 0;
    animation: reveal 1.6s ease-out 0.2s forwards;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    width: 100%;
    max-width: 980px;
    height: auto;
    display: block;
  }

  .announcement {
    max-width: 620px;
    margin: clamp(28px, 5vh, 48px) 0 0;
    padding: 0;
    color: var(--navy);
    font-size: clamp(14px, 1.4vw, 16px);
    line-height: 1.45;
    letter-spacing: 0.01em;
    text-align: left;
    opacity: 0;
    animation: reveal 1.6s ease-out 2.7s forwards;
  }

  footer {
    position: absolute;
    bottom: clamp(20px, 4vh, 40px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 1;
    opacity: 0;
    animation: reveal 1.6s ease-out 3.05s forwards;
  }

  footer a {
    color: var(--email);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: color 0.6s ease;
  }

  footer a:hover {
    color: var(--email-hover);
  }

  @media (max-width: 640px) {
    .logo { max-width: 92vw; }
    .announcement { font-size: 13.5px; padding: 0 2vw; }
    footer a { font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    main, .announcement, footer { animation: none; opacity: 1; }
  }
</style>
</head>
